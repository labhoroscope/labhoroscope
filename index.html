<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Horoscope</title>
<meta name="description" content="Tap your sign to reveal what the stars say about your lab group this week.">
<link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts hosted locally (SIL Open Font License). No requests to Google. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/bricolage-grotesque-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/source-serif-4-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/source-serif-4-latin-600-normal.woff2") format("woff2")}

:root{--bg:#EDF1EF;--ink:#16212B;--muted:#556570;--plate:#FAFCFB;--line:#C4CFCB;
--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--serif:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A21;--ink:#E6EEF0;--muted:#93A5AE;--plate:#172630;--line:#2B3E4A}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,11vw,6.5rem);line-height:.92;letter-spacing:-.035em;margin:0}
.sub{font-size:1.15rem;color:var(--muted);margin:14px 0 0}
.week{display:inline-block;margin-top:20px;font-family:var(--display);font-weight:500;border:1.5px solid var(--ink);border-radius:99px;padding:4px 14px}
h2.step{font-family:var(--display);font-weight:500;font-size:1.05rem;color:var(--muted);margin:40px 0 12px}
.plate{background:var(--plate);border:1.5px solid var(--line);border-radius:28px 28px 28px 8px;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
@media(min-width:600px){.plate{grid-template-columns:repeat(6,1fr)}}
.sign{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--muted);border-radius:12px;padding:4px 2px}
.sign small{font-size:.72rem;opacity:.85}
.dot{width:min(64px,100%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 38%),var(--c);border:3px solid var(--line);display:grid;place-items:center;color:#fff;font-size:1.8rem;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.sign:hover .dot{transform:scale(1.07)}
.sign:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sign[aria-pressed="true"]{color:var(--ink)}
.sign[aria-pressed="true"] .dot{border-color:var(--ink);box-shadow:0 0 0 4px var(--plate),0 0 0 6px var(--ink)}
.reading{margin-top:28px;border-left:6px solid var(--c);padding:6px 0 6px 22px}
.reading[hidden]{display:none}
.reading.show{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.reading.show{animation:none}.dot{transition:none}}
.reading h3{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;letter-spacing:-.02em;margin:0}
.reading h3 small{display:block;font-weight:500;font-size:.95rem;letter-spacing:0;color:var(--muted);margin-top:6px}
.reading .text{font-size:1.4rem;line-height:1.4;margin:18px 0 24px;max-width:30em}
.meters{display:grid;grid-template-columns:1fr;gap:10px;max-width:420px}
.meter{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-weight:500}
.pips{display:flex;gap:5px}
.pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.pips i.on{background:var(--c);border-color:var(--c)}
.note{margin-top:48px;color:var(--muted);font-size:.9rem}
.foot{text-align:center;padding:10px;font-size:12px;color:var(--muted)}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lab Horoscope</h1>
  <p class="sub">What the stars say about your lab group this week.</p>
  <span class="week" id="week"></span>

  <h2 class="step">Tap your sign</h2>
  <div class="plate" id="plate" role="group" aria-label="Zodiac signs"></div>

  <section class="reading" id="reading" hidden aria-live="polite">
    <h3 id="rname"></h3>
    <p class="text" id="rtext"></p>
    <div class="meters" id="rmeters"></div>
  </section>

  <p class="note">For entertainment only. Any resemblance to your actual lab is a coincidence of the cosmos.</p>
</div>

<script>
/* =====================================================================
   EDIT HERE EVERY WEEK
   1) Change the week label.
   2) For each sign, change the text between the quotation marks and the
      four levels (whole numbers from 1 to 5):
        luck = luck in the lab      stress = stress level
        caffeine = coffee intake    sleep = hours of sleep
   Keep the quotation marks and the comma at the end of each line.
   If a phrase contains a quotation mark ("), write it as \"
   ===================================================================== */
const WEEK = "Week of October 26, 2026";

const HOROSCOPE = {
  Aries:       { text: "You will take the lead on something nobody saw coming, and the whole group will happily follow.", luck: 4, stress: 3, caffeine: 4, sleep: 3 },
  Taurus:      { text: "You will stay perfectly calm while everyone else panics, and nobody will suspect it was a strategy.", luck: 3, stress: 2, caffeine: 3, sleep: 5 },
  Gemini:      { text: "You will strike up a chat with a labmate you barely knew and walk away with a new friend.", luck: 4, stress: 3, caffeine: 4, sleep: 3 },
  Cancer:      { text: "Someone in the group will need a kind word, and you will turn out to be exactly the right person.", luck: 4, stress: 2, caffeine: 2, sleep: 4 },
  Leo:         { text: "Your hard work will finally get noticed, and the praise will come from where you least expect it.", luck: 4, stress: 2, caffeine: 3, sleep: 3 },
  Virgo:       { text: "You will get through your entire to-do list and still find time to help a teammate.", luck: 3, stress: 3, caffeine: 4, sleep: 3 },
  Libra:       { text: "You will make peace with a labmate you have not gotten along with until now.", luck: 4, stress: 2, caffeine: 3, sleep: 4 },
  Scorpio:     { text: "A quiet moment of insight will change how the whole group sees a stubborn problem.", luck: 3, stress: 3, caffeine: 4, sleep: 3 },
  Sagittarius: { text: "A wild idea will come up in a casual chat, and suddenly everyone wants to hear more.", luck: 5, stress: 3, caffeine: 3, sleep: 2 },
  Capricorn:   { text: "You will take on too much again, but a teammate will step in just when you need it.", luck: 3, stress: 5, caffeine: 5, sleep: 1 },
  Aquarius:    { text: "An odd suggestion from you will turn out to be exactly what the group needed.", luck: 5, stress: 2, caffeine: 3, sleep: 3 },
  Pisces:      { text: "You will have a calm, dreamy week in which everything falls into place on its own.", luck: 4, stress: 1, caffeine: 2, sleep: 5 }
};
/* ===================== END OF THE PART YOU EDIT ===================== */

const SIGNS = [
  ["Aries","Mar 21 – Apr 19","\u2648","#E4572E"],
  ["Taurus","Apr 20 – May 20","\u2649","#4FA34A"],
  ["Gemini","May 21 – Jun 20","\u264A","#D9A21B"],
  ["Cancer","Jun 21 – Jul 22","\u264B","#2F7DE1"],
  ["Leo","Jul 23 – Aug 22","\u264C","#E4572E"],
  ["Virgo","Aug 23 – Sep 22","\u264D","#4FA34A"],
  ["Libra","Sep 23 – Oct 22","\u264E","#D9A21B"],
  ["Scorpio","Oct 23 – Nov 21","\u264F","#2F7DE1"],
  ["Sagittarius","Nov 22 – Dec 21","\u2650","#E4572E"],
  ["Capricorn","Dec 22 – Jan 19","\u2651","#4FA34A"],
  ["Aquarius","Jan 20 – Feb 18","\u2652","#D9A21B"],
  ["Pisces","Feb 19 – Mar 20","\u2653","#2F7DE1"]
];
const METERS = [["luck","Luck in the lab"],["stress","Stress"],["caffeine","Caffeine"],["sleep","Sleep"]];

const $ = id => document.getElementById(id);
$("week").textContent = WEEK;
const plate = $("plate"), reading = $("reading");

SIGNS.forEach(([name, dates, glyph, color], i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "sign"; b.setAttribute("aria-pressed", "false");
  b.style.setProperty("--c", color);
  const d = document.createElement("span"); d.className = "dot"; d.textContent = glyph + "\uFE0E"; d.setAttribute("aria-hidden", "true");
  const n = document.createElement("span"); n.textContent = name;
  const s = document.createElement("small"); s.textContent = dates;
  b.append(d, n, s);
  b.addEventListener("click", () => reveal(i, b));
  plate.appendChild(b);
});

function reveal(i, btn) {
  const [name, dates, , color] = SIGNS[i], data = HOROSCOPE[name] || {};
  [...plate.children].forEach(x => x.setAttribute("aria-pressed", x === btn));
  reading.style.setProperty("--c", color);
  const h = $("rname"); h.textContent = name;
  const sm = document.createElement("small"); sm.textContent = dates; h.appendChild(sm);
  $("rtext").textContent = data.text || "";
  const box = $("rmeters"); box.textContent = "";
  METERS.forEach(([key, label]) => {
    const v = Math.max(0, Math.min(5, Math.round(Number(data[key]) || 0)));
    const row = document.createElement("div"); row.className = "meter";
    const l = document.createElement("span"); l.textContent = label;
    const p = document.createElement("span"); p.className = "pips"; p.setAttribute("role", "img"); p.setAttribute("aria-label", v + " out of 5");
    for (let k = 1; k <= 5; k++) { const e = document.createElement("i"); if (k <= v) e.className = "on"; p.appendChild(e); }
    row.append(l, p); box.appendChild(row);
  });
  reading.hidden = false;
  reading.classList.remove("show"); void reading.offsetWidth; reading.classList.add("show");
  reading.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "nearest" });
}
</script>

<footer class="foot">
  © 2026. All rights reserved. · <a href="privacy.html">Privacy policy / Privacidad</a>
</footer>

</body>
</html>
